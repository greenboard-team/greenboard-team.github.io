<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<!-- Greenboard · prototipo navegable del MVP (issue #42).
     Sigue el mock-up de Gonzalo (PR #25, «Así se ve el Greenboard de Gonzalo»): mismas pantallas y mismo aspecto.
     Único cambio pedido: el justificante de una falta se sube en Asistencia, en la misma fila del 0 rojo, no en Trámites.
     Happy Path: greenboard/mvp/happy-path.md. Una sola página, sin servidor; rutas con #/ para que «atrás» funcione. -->
<title>Greenboard · prototipo</title>
<meta name="theme-color" content="#123B2C">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700;12..96,800&family=Atkinson+Hyperlegible:wght@400;700&family=JetBrains+Mono:wght@500&display=swap">
<style>
/* Colores, tipos y piezas copiados del mock-up de Gonzalo (web/index.html de la PR #25) */
:root{
  --bg:#F3F6F1; --surface:#FFFFFF; --ink:#13241C; --muted:#56685E; --line:#D5DED7;
  --board:#123B2C; --board-2:#1A4D3A; --chalk:#E9F2E4; --lime:#9BE15D; --accent:#1F8F5F;
  --warn:#B4541A; --warn-bg:#FCEBDD; --ok-bg:#E2F3E8; --late:#B3261E; --late-bg:#FBE4E2;
  --f-display:"Bricolage Grotesque","Avenir Next",system-ui,sans-serif;
  --f-body:"Atkinson Hyperlegible","Segoe UI",system-ui,sans-serif;
  --f-mono:"JetBrains Mono",ui-monospace,Menlo,monospace;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0E1713; --surface:#16231D; --ink:#E6EFE8; --muted:#9DB0A5; --line:#2A3B33;
  --board:#0B2A1F; --board-2:#123628; --chalk:#E9F2E4; --lime:#A8E86F; --accent:#4CC28B;
  --warn:#F0A066; --warn-bg:#3A2616; --ok-bg:#16352A; --late:#FF8A80; --late-bg:#3B1A18; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0E1713; --surface:#16231D; --ink:#E6EFE8; --muted:#9DB0A5; --line:#2A3B33;
  --board:#0B2A1F; --board-2:#123628; --chalk:#E9F2E4; --lime:#A8E86F; --accent:#4CC28B;
  --warn:#F0A066; --warn-bg:#3A2616; --ok-bg:#16352A; --late:#FF8A80; --late-bg:#3B1A18; color-scheme:dark}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{min-height:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:16px;line-height:1.5;margin:0}
h1,h2,h3,h4{font-family:var(--f-display);line-height:1.1;text-wrap:balance;margin:0}
a{color:var(--accent)}
:focus-visible{outline:3px solid var(--lime);outline-offset:2px;border-radius:6px}
button{font:inherit;cursor:pointer;color:inherit}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border:0;border-radius:999px;padding:12px 20px;font-weight:700;background:var(--lime);color:#10301F;text-decoration:none}
.btn:disabled{background:var(--ok-bg);color:var(--accent);cursor:default}
.btn.dark{background:var(--board);color:var(--chalk)}
.note{font-size:13px;color:var(--muted)}

/* Marco de la app: barra lateral verde + contenido (como el mock-up). En el móvil, la barra pasa arriba */
.app{min-height:100vh;display:grid;grid-template-columns:240px minmax(0,1fr);background:var(--surface)}
.side{min-width:0}
.side{background:var(--board);color:var(--chalk);padding:18px 14px;display:flex;flex-direction:column;gap:4px;position:relative}
.side::after{content:"";position:absolute;inset:0;pointer-events:none;opacity:.07;
  background-image:radial-gradient(circle at 20% 30%,#fff 0 1px,transparent 1.5px),radial-gradient(circle at 70% 60%,#fff 0 1px,transparent 1.5px);background-size:23px 29px,31px 37px}
.brand{display:flex;align-items:center;gap:8px;font-family:var(--f-display);font-weight:800;font-size:18px;margin-bottom:16px}
.brand i{width:28px;height:28px;border-radius:8px;background:var(--lime);display:grid;place-items:center;color:#10301F;font-style:normal;font-size:16px}
.who{display:flex;align-items:center;gap:10px;margin-bottom:14px}
.avatar{width:38px;height:38px;border-radius:50%;background:var(--lime);color:#10301F;display:grid;place-items:center;font-weight:700;flex:none}
.who small{display:block;color:#A9C4AE;font-size:12px}
.tabs{display:flex;flex-direction:column;gap:4px;position:relative;z-index:1}
.tab{background:transparent;border:0;color:var(--chalk);text-align:left;padding:10px 12px;border-radius:10px;display:flex;justify-content:space-between;align-items:center;gap:8px;text-decoration:none;white-space:nowrap}
.tab[aria-current="page"]{background:var(--board-2);box-shadow:inset 3px 0 0 var(--lime)}
.tab .count{font-family:var(--f-mono);font-size:12px;background:rgba(255,255,255,.12);border-radius:999px;padding:1px 8px}
.tab .count.rojo{background:var(--late);color:#fff}
.main{padding:22px;min-width:0;padding-bottom:110px;max-width:860px}
.main h3{font-size:24px}
.row{display:flex;flex-wrap:wrap;gap:8px 14px;align-items:baseline;justify-content:space-between}
.demo-flag{font-family:var(--f-mono);font-size:11px;color:var(--muted);border:1px dashed var(--line);border-radius:6px;padding:2px 6px}
.atras{display:inline-flex;align-items:center;gap:4px;font-size:14px;font-weight:700;color:var(--muted);text-decoration:none;margin-bottom:12px}

@media (max-width:760px){
  .app{grid-template-columns:minmax(0,1fr);grid-template-rows:auto 1fr}
  .side{padding:14px 16px 10px}
  .brand{margin-bottom:10px}
  .who{margin-bottom:10px}
  .tabs{flex-direction:row;overflow-x:auto;gap:6px;margin:0 -16px;padding:0 16px 4px;scrollbar-width:none}
  .tabs::-webkit-scrollbar{display:none}
  .tab{padding:8px 12px}
  .tab[aria-current="page"]{box-shadow:inset 0 -3px 0 var(--lime)}
  .main{padding:18px 16px 120px}
  .main h3{font-size:22px}
  .item{grid-template-columns:62px 1fr auto}
}

/* Listas, tarjetas y pastillas del mock-up */
.list{display:flex;flex-direction:column;gap:8px;margin-top:14px}
.item{display:grid;grid-template-columns:110px 1fr auto;gap:12px;align-items:center;padding:12px 14px;border:1px solid var(--line);border-radius:12px;background:var(--bg);color:inherit;text-decoration:none}
a.item:hover,a.card:hover{border-color:var(--accent)}
.item time{font-family:var(--f-mono);font-size:13px}
.item .what{min-width:0;font-weight:700}
.item .what small{display:block;color:var(--muted);font-weight:400}
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:12px;margin-top:14px}
.card{border:1px solid var(--line);border-radius:12px;padding:14px;background:var(--bg);min-width:0;color:inherit;text-decoration:none;display:block}
.card h4{margin:0 0 4px;font-size:15px}
.card.act{display:flex;flex-direction:column;gap:4px}
.card.act .note{margin:0 0 14px}
.card.act .btn{margin-top:auto;align-self:flex-start;min-width:150px}
.code{font-family:var(--f-mono);font-size:11.5px;color:var(--muted);word-break:break-all}
.pill{display:inline-block;font-size:12px;font-weight:700;border-radius:999px;padding:2px 10px;white-space:nowrap}
.pill.late{background:var(--late-bg);color:var(--late)}
.pill.soon{background:var(--warn-bg);color:var(--warn)}
.pill.ok{background:var(--ok-bg);color:var(--accent)}
.banner{display:flex;gap:12px;align-items:center;background:var(--ok-bg);border-radius:12px;padding:12px 14px;margin-top:14px}
.banner b{color:var(--accent)}
.sub{font-size:18px;margin-top:24px}
.doc{border:1px solid var(--line);border-radius:12px;padding:18px;background:var(--surface);font-size:14px;max-width:520px;margin-top:12px}
.doc h5{margin:0 0 8px;font-family:var(--f-display);font-size:18px}
.ficha{display:grid;gap:4px;margin:6px 0 4px}
.ficha h3{font-size:26px}

/* Asistencia: 1 en verde, 0 en rojo; el justificante se sube en la misma fila */
.asis{display:flex;flex-direction:column;gap:8px;margin-top:14px}
.ses{border:1px solid var(--line);border-radius:12px;background:var(--bg);padding:12px 14px;display:grid;grid-template-columns:1fr auto;gap:10px;align-items:center}
.ses time{font-family:var(--f-mono);font-size:13px}
.ses small{display:block;color:var(--muted);font-size:13px}
.nota-a{font-family:var(--f-display);font-weight:800;font-size:28px;width:44px;height:44px;border-radius:12px;display:grid;place-items:center;background:var(--ok-bg);color:var(--accent)}
.ses.falta{border-color:var(--late);background:var(--late-bg)}
.ses.falta .nota-a{background:var(--late);color:#fff}
.ses.enviado{border-color:var(--warn)}
.ses.enviado .nota-a{background:var(--late);color:#fff}
.ses .just{grid-column:1/-1;display:grid;gap:8px}
.resumen{display:flex;gap:10px;align-items:center;margin-top:10px;flex-wrap:wrap}
.drop{display:flex;align-items:center;gap:12px;padding:12px;border:1.5px dashed var(--late);border-radius:12px;background:var(--surface);cursor:pointer;position:relative}
.drop:hover,.drop:focus-within{border-color:var(--accent)}
.drop input{position:absolute;width:1px;height:1px;opacity:0;pointer-events:none}
.drop .ico{width:38px;height:38px;flex:none;border-radius:10px;background:var(--board);color:var(--lime);display:grid;place-items:center;font-weight:700}
.drop b{display:block;font-size:14px}
.drop small{color:var(--muted);font-size:13px;overflow-wrap:anywhere}
.drop.has{border-style:solid;border-color:var(--accent);background:var(--ok-bg)}
.just .fila-b{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.linkbtn{border:0;background:none;padding:0;color:var(--accent);text-decoration:underline;font-size:13px}

/* Guía de la demo: barra verde oscura abajo, como la «demo guiada» del mock-up */
.guide{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(12px + env(safe-area-inset-bottom,0px));z-index:20;width:min(560px,calc(100% - 24px));background:var(--board);color:var(--chalk);border-radius:14px;padding:10px 14px;display:flex;gap:10px;align-items:center;box-shadow:0 10px 30px rgba(0,0,0,.3)}
.guide b{font-family:var(--f-mono);font-weight:500;font-size:12px;color:var(--lime);white-space:nowrap}
.guide p{margin:0;flex:1;min-width:0;font-size:14px}
.guide a{color:var(--lime)}
.guide button{border:0;background:none;color:#A9C4AE;font-size:13px;text-decoration:underline;padding:4px}
.guide-on{position:fixed;right:12px;bottom:calc(12px + env(safe-area-inset-bottom,0px));z-index:20}
.spot{outline:3px solid var(--lime);outline-offset:3px;border-radius:12px}
.toast{position:fixed;left:50%;top:16px;transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:12px;font-size:14px;z-index:30;max-width:calc(100% - 32px)}
.pie{margin-top:28px}
@media (max-width:760px){.item{grid-template-columns:64px minmax(0,1fr) auto;gap:10px}}
</style>
</head>
<body>
<div class="app">
  <aside class="side">
    <span class="brand"><i>G</i>Greenboard</span>
    <div class="who"><span class="avatar">GM</span><span>Gonzalo Martínez<small>4.º MAIS · U-tad</small></span></div>
    <nav class="tabs" id="tabs" aria-label="Secciones"></nav>
  </aside>
  <main class="main" id="view" aria-live="polite"></main>
</div>
<div id="guia"></div>
<div id="toast" class="toast" role="status" hidden></div>

<script>
/* ---------- Datos ----------
   Asignaturas, códigos y entregas: los reales de Blackboard que usa el mock-up (26/10/2026).
   Horario, aulas, asistencia, compañeros y trámites: de ejemplo, como en el mock-up. */
const SUBJECTS = [
  {id:'opti', n:"Optimización", c:"2609_MAIS4_OPTI_A"},
  {id:'psdi', n:"Programación de Sistemas Distribuidos", c:"2609_MAIS3_PSDI_A_FIIS3_A"},
  {id:'aaui', n:"Aprendizaje Automático I", c:"2609_MAIS4_AAUI_A_FIIS4_A"},
  {id:'pro3', n:"Proyectos III: Desarrollo Web y Apps", c:"2609_MAIS4_PRO3_A_FIIS4_A", p:"Alberto León Martín"},
  {id:'esal', n:"Estructuras Algebraicas", c:"2609_MAIS4_ESAL_A", last:"Nuevo: Grupos 7 · Homomorfismos.pdf"},
  {id:'aiii', n:"Análisis Matemático III", c:"2609_MAIS4_AIII_A", last:"Calificación publicada: Asistencia"},
  {id:'isof', n:"Ingeniería del Software", c:"2609_MAIS4_ISOF_A_FIIS4_A_INSG_A", last:"Nuevo contenido añadido"}
];
const DUE = [
  {t:"Entregables 1", s:'opti', d:"2026-10-23T10:48"},
  {t:"Práctica 1", s:'psdi', d:"2026-10-28T23:59"},
  {t:"Proyecto I: Gemstone prices", s:'aaui', d:"2026-11-09T23:59"},
  {t:"SPRINT 2 · Presentación de 7 min", s:'pro3', d:"2026-11-10T23:59"},
  {t:"Participación", s:'esal', d:"2026-12-22T11:01"}
];
/* Horario de ejemplo (no viene de WebUntis). El cambio de aula es el aviso del mock-up */
const TODAY = [
  {h:"09:00", s:'aiii', a:"Aula 201"},
  {h:"11:00", s:'pro3', a:"Aula 112", antes:"Aula 003", changed:true},
  {h:"15:00", s:'opti', a:"Aula 104"}
];
/* Asistencia de ejemplo: sesiones pasadas (días antes de hoy). La falta es la de Análisis Matemático III */
const ASIS = {
  aiii:[{dias:1,v:0},{dias:3,v:1},{dias:8,v:1},{dias:10,v:1},{dias:15,v:1}],
};
const ASIS_DEF = [{dias:2,v:1},{dias:7,v:1},{dias:9,v:1},{dias:14,v:1}];
const COMUNIDAD = [
  {id:'apuntes', t:"Apuntes de Análisis Matemático III", s:"Compartidos por un alumno de 5.º · curso 2025/26", accion:"Pedir acceso", hecho:"Solicitud enviada",
   det:["Tema 1 · Sucesiones y series de funciones","Tema 2 · Integrales de línea","Tema 3 · Integrales de superficie","Exámenes resueltos 2025/26"]},
  {id:'repaso', t:"Repaso de Optimización", s:"Sesión de apoyo en grupo · jueves 18:00", accion:"Apuntarme", hecho:"Apuntado",
   det:["Jueves, 18:00 – 19:30","Lo da un alumno que ya aprobó la asignatura","Grupo pequeño: trae tus dudas de la hoja de ejercicios"]}
];
const subj = id => SUBJECTS.find(s => s.id===id);

/* ---------- Estado de la demo (en la sesión del navegador, si se puede) ---------- */
const INI = {vioAsig:false, archivo:null, justificado:false, com:{}, mat:false, guia:true};
let S = JSON.parse(JSON.stringify(INI));
try{ Object.assign(S, JSON.parse(sessionStorage.getItem('gb-mvp')||'{}')); }catch(e){}
const guardar = () => { try{ sessionStorage.setItem('gb-mvp', JSON.stringify(S)); }catch(e){} };
function reiniciar(){ S = JSON.parse(JSON.stringify(INI)); guardar(); location.hash = '#/hoy'; render(); }

/* ---------- Utilidades de fecha (las pastillas se calculan con la fecha real, como en el mock-up) ---------- */
const fmt = new Intl.DateTimeFormat('es-ES',{day:'numeric',month:'short'});
const fmtH = new Intl.DateTimeFormat('es-ES',{hour:'2-digit',minute:'2-digit'});
const fmtDia = new Intl.DateTimeFormat('es-ES',{weekday:'short',day:'numeric',month:'short'});
const haceDias = n => { const d = new Date(); d.setDate(d.getDate()-n); return d; };
function daysLeft(iso){ return Math.ceil((new Date(iso) - new Date())/864e5); }
function pill(iso){
  const d = daysLeft(iso);
  if (new Date(iso) < new Date()) return '<span class="pill late">vencida</span>';
  if (d <= 2) return `<span class="pill soon">${d<=1?'mañana':'en '+d+' días'}</span>`;
  return `<span class="pill ok">en ${d} días</span>`;
}
const ses = id => ASIS[id] || ASIS_DEF;
const faltasPend = () => S.justificado ? 0 : 1;

/* ---------- Pantallas ---------- */
const ruta = () => location.hash.replace(/^#\/?/,'') || 'hoy';
const V = {};

V.hoy = () => {
  const next = DUE.filter(x => new Date(x.d) > new Date()).slice(0,2);
  return `<div class="row"><h3>Hoy</h3><span class="demo-flag">horario y aulas de ejemplo</span></div>
  <div class="banner" id="spot-push"><b>Aviso</b><span>Proyectos III cambia al <b>aula 112</b>. Ya está actualizado en tu horario.</span></div>
  <div class="list" id="spot-horario">${TODAY.map(c => `<a class="item" href="#/asig/${c.s}"><time>${c.h}</time><div class="what">${subj(c.s).n.split(':')[0]}<small>${c.a}${c.changed?' · antes en el '+c.antes.toLowerCase():''}</small></div>${c.changed?'<span class="pill ok">cambiado</span>':''}</a>`).join('')}</div>
  <h3 class="sub">Lo próximo que entregas</h3>
  <div class="list" id="spot-next">${next.length ? next.map(x => `<a class="item" href="#/asig/${x.s}"><time>${fmt.format(new Date(x.d))}</time><div class="what">${x.t}<small>${subj(x.s).n}</small></div>${pill(x.d)}</a>`).join('') : '<p class="note">No tienes entregas pendientes.</p>'}</div>`;
};

V.asig = (id) => {
  if (id) return V.asignatura(id);
  return `<div class="row"><h3>Mis asignaturas</h3><span class="note">7 asignaturas · datos de Blackboard</span></div>
  <div class="cards">${SUBJECTS.map(s => {
    const falta = s.id==='aiii' && !S.justificado;
    return `<a class="card" href="#/asig/${s.id}" id="card-${s.id}"><h4>${s.n}</h4><div class="code">${s.c}</div>${s.p?`<p class="note" style="margin:8px 0 0">Profesor: ${s.p}</p>`:''}${s.last?`<p class="note" style="margin:8px 0 0">${s.last}</p>`:''}${falta?'<p style="margin:8px 0 0"><span class="pill late">1 falta sin justificar</span></p>':''}</a>`;
  }).join('')}</div>`;
};

V.asignatura = (id) => {
  const s = subj(id); if (!s) return V.asig();
  if (id==='aiii'){ S.vioAsig = true; guardar(); }
  const ents = DUE.filter(x => x.s===id);
  const lista = ses(id);
  const pres = lista.filter(x => x.v).length;
  const filas = lista.map((x,i) => {
    const fecha = fmtDia.format(haceDias(x.dias));
    if (x.v) return `<div class="ses"><div><time>${fecha}</time><small>Asistencia registrada</small></div><span class="nota-a">1</span></div>`;
    if (S.justificado) return `<div class="ses enviado"><div><time>${fecha}</time><small>Justificante enviado: <b>${S.archivo}</b> · pendiente de revisión</small></div><span class="nota-a">0</span></div>`;
    return `<div class="ses falta" id="fila-falta"><div><time>${fecha}</time><small style="color:var(--late);font-weight:700">Falta sin justificar</small></div><span class="nota-a" aria-label="Asistencia: 0">0</span>
      <div class="just">
        <label class="drop ${S.archivo?'has':''}" id="drop" for="j-file"><input type="file" id="j-file" accept=".pdf,image/*"><span class="ico" aria-hidden="true">↑</span><span><b>${S.archivo || 'Sube el justificante'}</b><small>${S.archivo ? 'Listo para enviar · toca para cambiarlo' : 'PDF o foto · aquí mismo, sin ir a Trámites'}</small></span></label>
        <div class="fila-b"><button class="btn" id="enviar" ${S.archivo?'':'disabled'} onclick="enviarJust()">Enviar justificante</button>${S.archivo?'':'<button class="linkbtn" onclick="ejemplo()">Usar un justificante de ejemplo</button>'}</div>
      </div></div>`;
  }).join('');
  return `<a class="atras" href="#/asig">‹ Mis asignaturas</a>
  <div class="ficha"><h3>${s.n}</h3><div class="code">${s.c}</div>${s.p?`<p class="note" style="margin:0">Profesor: ${s.p}</p>`:''}</div>
  <div class="row"><h3 class="sub">Asistencia</h3><span class="demo-flag">asistencia de ejemplo</span></div>
  <div class="resumen"><span class="pill ${pres===lista.length?'ok':'late'}">${pres} de ${lista.length} sesiones</span><span class="note">Últimas sesiones, de la más reciente a la más antigua</span></div>
  <div class="asis">${filas}</div>
  <h3 class="sub">Entregas</h3>
  <div class="list">${ents.length ? ents.map(x => `<div class="item"><time>${fmt.format(new Date(x.d))} · ${fmtH.format(new Date(x.d))}</time><div class="what">${x.t}<small>${s.n}</small></div>${pill(x.d)}</div>`).join('') : '<p class="note" style="margin:0">No hay entregas publicadas.</p>'}</div>`;
};

V.ent = () => `<div class="row"><h3>Entregas</h3><span class="note">Todas tus asignaturas, por fecha</span></div>
  <div class="list">${DUE.map(x => `<a class="item" href="#/asig/${x.s}"><time>${fmt.format(new Date(x.d))} · ${fmtH.format(new Date(x.d))}</time><div class="what">${x.t}<small>${subj(x.s).n}</small></div>${pill(x.d)}</a>`).join('')}</div>`;

V.tram = () => `<div class="row"><h3>Trámites</h3><span class="demo-flag">simulado: no se envía nada</span></div>
  <div class="banner"><span>Los justificantes de faltas ya no van aquí: se suben en <b>Asistencia</b>, junto a la falta. <a href="#/asig/aiii">Ver mi asistencia</a></span></div>
  <h3 class="sub">Matrícula firmada</h3>
  <button class="btn dark" type="button" style="margin-top:10px" onclick="S.mat=!S.mat;guardar();render()">${S.mat?'Ocultar':'Ver'} matrícula 2026/27</button>
  ${S.mat ? `<div class="doc"><h5>Matrícula 2026/27 · ejemplo</h5>Alumno: Gonzalo Martínez Fernández<br>Titulación: Doble Grado MAIS, 4.º curso<br>Asignaturas: ${SUBJECTS.length}<br><span class="note">Documento de muestra. En la app real sería el PDF firmado de Secretaría.</span></div>` : ''}`;

V.com = (id) => {
  if (id) return V.comItem(id);
  return `<div class="row"><h3>Comunidad</h3><span class="demo-flag">compañeros de ejemplo</span></div>
  <p class="note">Apuntes y clases de apoyo de alumnos que ya aprobaron la asignatura.</p>
  <div class="cards">${COMUNIDAD.map(c => `<div class="card act" id="com-${c.id}"><h4><a href="#/com/${c.id}" style="color:inherit">${c.t}</a></h4><p class="note">${c.s}</p><button class="btn" type="button" id="btn-${c.id}" ${S.com[c.id]?'disabled':''} onclick="comAccion('${c.id}')">${S.com[c.id]?'✓ '+c.hecho:c.accion}</button></div>`).join('')}</div>`;
};

V.comItem = (id) => {
  const c = COMUNIDAD.find(x => x.id===id); if (!c) return V.com();
  const bloqueado = c.id==='apuntes';
  return `<a class="atras" href="#/com">‹ Comunidad</a>
  <div class="ficha"><h3>${c.t}</h3><p class="note" style="margin:0">${c.s}</p></div>
  <div class="list">${c.det.map(d => `<div class="item" style="grid-template-columns:1fr auto"><div class="what">${d}</div>${bloqueado?`<span class="pill ${S.com[id]?'soon':'late'}">${S.com[id]?'pendiente':'sin acceso'}</span>`:''}</div>`).join('')}</div>
  <p style="margin-top:16px"><button class="btn" type="button" id="btn-${c.id}" ${S.com[c.id]?'disabled':''} onclick="comAccion('${c.id}')">${S.com[c.id]?'✓ '+c.hecho:c.accion}</button></p>
  ${S.com[id] ? `<p class="note">${bloqueado ? 'Te avisaremos cuando acepte la solicitud.' : 'Te lo recordaremos el jueves.'} En la demo no se envía nada.</p>` : ''}`;
};

/* ---------- Acciones ---------- */
function enviarJust(){ if(!S.archivo) return; S.justificado = true; guardar(); render(); toast('Justificante enviado. La falta queda pendiente de revisión.'); }
function ejemplo(){ S.archivo = 'justificante-medico.pdf'; guardar(); render(); }
function comAccion(id){ S.com[id] = true; guardar(); render(); toast(id==='apuntes' ? 'Solicitud enviada (demo)' : 'Apuntado (demo)'); }

/* ---------- Guía del Happy Path: qué toca según lo que ya se ha hecho ---------- */
function paso(){
  const r = ruta();
  if (!S.vioAsig){
    if (r==='hoy') return {n:1, t:'Aviso: Proyectos III cambia de aula y el horario ya está cambiado. Abre «Asignaturas».', obj:'#tab-asig'};
    if (r==='asig') return {n:2, t:'Análisis Matemático III ha publicado la asistencia. Tócala.', obj:'#card-aiii'};
    return {n:1, t:'', ir:'#/hoy'};
  }
  if (!S.justificado){
    if (r==='asig/aiii') return {n:3, t: S.archivo ? 'Justificante listo. Envíalo.' : 'Un 0 en rojo: faltó. Sube el justificante ahí mismo.', obj: S.archivo ? '#enviar' : '#fila-falta'};
    return {n:3, t:'', ir:'#/asig/aiii'};
  }
  if (!S.com.apuntes){
    if (r==='asig/aiii') return {n:4, t:'Hecho, sin pasar por Trámites. Ahora abre «Comunidad».', obj:'#tab-com'};
    if (r==='com' || r==='com/apuntes') return {n:4, t:'Pide los apuntes de Análisis III a un alumno de 5.º.', obj:'#btn-apuntes'};
    return {n:4, t:'', ir:'#/com'};
  }
  return {n:5, t:'Fin del recorrido: horario con cambios, entregas, asistencia con su justificante y comunidad.'};
}
function guiaHTML(){
  if (!S.guia) return `<button class="btn guide-on" onclick="S.guia=true;guardar();render()">Guía de la demo</button>`;
  const p = paso();
  const txt = p.n===5 ? `${p.t} <a href="#" onclick="reiniciar();return false">Reiniciar</a>`
            : p.t || `Fuera del recorrido. <a href="${p.ir}">Volver al paso ${p.n}</a>`;
  return `<div class="guide" role="status"><b>${p.n===5?'Demo ✓':'Paso '+p.n+'/4'}</b><p>${txt}</p><button onclick="S.guia=false;guardar();render()">Ocultar</button></div>`;
}

/* ---------- Pintar ---------- */
let toastT;
function toast(m){ const t = document.getElementById('toast'); t.textContent = m; t.hidden = false; clearTimeout(toastT); toastT = setTimeout(() => t.hidden = true, 2600); }

function render(){
  const [r, arg] = ruta().split('/');
  const vista = (V[r] || V.hoy)(arg);            // primero la vista: algunas marcan progreso
  const act = V[r] ? r : 'hoy';
  const vivas = DUE.filter(x => new Date(x.d) > new Date()).length;
  document.getElementById('tabs').innerHTML = [
    ['hoy','Hoy', `<span class="count">${TODAY.length}</span>`],
    ['asig','Asignaturas', faltasPend() ? `<span class="count rojo" title="Faltas sin justificar">${faltasPend()}</span>` : `<span class="count">${SUBJECTS.length}</span>`],
    ['ent','Entregas', `<span class="count">${vivas}</span>`],
    ['tram','Trámites',''],
    ['com','Comunidad','']
  ].map(([k,t,c]) => `<a class="tab" id="tab-${k}" href="#/${k}" ${act===k?'aria-current="page"':''}>${t} ${c}</a>`).join('');
  document.getElementById('view').innerHTML = vista + `<p class="note pie">Prototipo del MVP · asignaturas y entregas reales de Blackboard (26/10/2026); horario, aulas, asistencia y compañeros de ejemplo · no se conecta a ningún portal · <a href="#" onclick="reiniciar();return false">Reiniciar demo</a></p>`;
  document.getElementById('guia').innerHTML = guiaHTML();
  if (S.guia){ const p = paso(); if (p.obj){ const el = document.querySelector(p.obj); if (el){ el.classList.add('spot'); if (el.classList.contains('tab')) el.scrollIntoView({inline:'center', block:'nearest'}); } } }
  const jf = document.getElementById('j-file');
  if (jf) jf.addEventListener('change', () => { const f = jf.files[0]; if (f){ S.archivo = f.name; guardar(); render(); } });
}
window.addEventListener('hashchange', () => { render(); window.scrollTo(0,0); });
render();
</script>
</body>
</html>
