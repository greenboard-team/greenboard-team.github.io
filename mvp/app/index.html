<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<!-- Greenboard · prototipo navegable del MVP (issue #42).
     Aspecto: el mock-up de Gonzalo (PR #25) + la pantalla principal de la diapositiva 7 del Sprint 2.
     Inicio es un panel que no hace falta abandonar: barra inteligente (Ctrl+K o «/») con sugerencias en vivo,
     chips según la hora y tus datos, y los resultados se abren como tarjetas en el mismo Inicio.
     La falta sale como un 0 rojo en Asistencia y el justificante se sube en esa misma fila.
     Asignaturas con pestañas (Contenido por temas y guía docente · Notas · Asistencia · Entregas · Chat),
     Calificaciones (media ponderada) y Mensajes (chats de clase y de grupo, issue #43).
     Happy Path: greenboard/mvp/happy-path.md. Página estática, datos de ejemplo, no se conecta a ningún portal. -->
<title>Greenboard · prototipo</title>
<meta name="theme-color" content="#123B2C">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700;12..96,800&family=Atkinson+Hyperlegible:wght@400;700&family=JetBrains+Mono:wght@500&display=swap">
<style>
/* Colores y tipos del mock-up de Gonzalo (PR #25) */
:root{
  --bg:#F3F6F1; --surface:#FFFFFF; --ink:#13241C; --muted:#56685E; --line:#D5DED7;
  --board:#123B2C; --board-2:#1A4D3A; --chalk:#E9F2E4; --lime:#9BE15D; --accent:#187A50;
  --warn:#A34A15; --warn-bg:#FCEBDD; --ok-bg:#E2F3E8; --late:#B3261E; --late-bg:#FBE4E2;
  --f-display:"Bricolage Grotesque","Avenir Next",system-ui,sans-serif;
  --f-body:"Atkinson Hyperlegible","Segoe UI",system-ui,sans-serif;
  --f-mono:"JetBrains Mono",ui-monospace,Menlo,monospace;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0E1713; --surface:#16231D; --ink:#E6EFE8; --muted:#9DB0A5; --line:#3A5046;
  --board:#0B2A1F; --board-2:#123628; --chalk:#E9F2E4; --lime:#A8E86F; --accent:#4CC28B;
  --warn:#F0A066; --warn-bg:#3A2616; --ok-bg:#16352A; --late:#FF8A80; --late-bg:#3B1A18; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0E1713; --surface:#16231D; --ink:#E6EFE8; --muted:#9DB0A5; --line:#3A5046;
  --board:#0B2A1F; --board-2:#123628; --chalk:#E9F2E4; --lime:#A8E86F; --accent:#4CC28B;
  --warn:#F0A066; --warn-bg:#3A2616; --ok-bg:#16352A; --late:#FF8A80; --late-bg:#3B1A18; color-scheme:dark}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{min-height:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:16px;line-height:1.5;margin:0}
h1,h2,h3,h4{font-family:var(--f-display);line-height:1.1;text-wrap:balance;margin:0}
a{color:var(--accent)}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px;border-radius:6px}
.side :focus-visible,.guide :focus-visible{outline-color:var(--lime)}
button{font:inherit;cursor:pointer;color:inherit}
svg.i{width:18px;height:18px;flex:none;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border:0;border-radius:999px;padding:11px 18px;font-weight:700;background:var(--lime);color:#10301F;text-decoration:none}
.btn:disabled{background:var(--ok-bg);color:var(--accent);cursor:default}
.btn.dark{background:var(--board);color:var(--chalk)}
.btn.sm{padding:7px 14px;font-size:14px}
.note{font-size:13px;color:var(--muted)}
.demo-flag{font-family:var(--f-mono);font-size:11px;color:var(--muted);border:1px dashed var(--line);border-radius:6px;padding:2px 6px;white-space:nowrap}

/* Marco: barra lateral verde (mock-up). En el móvil pasa arriba y las pestañas se deslizan */
.app{min-height:100vh;display:grid;grid-template-columns:240px minmax(0,1fr);background:var(--bg)}
.side{background:var(--board);color:var(--chalk);padding:18px 14px;display:flex;flex-direction:column;gap:4px;position:relative;min-width:0}
.side::after{content:"";position:absolute;inset:0;pointer-events:none;opacity:.07;
  background-image:radial-gradient(circle at 20% 30%,#fff 0 1px,transparent 1.5px),radial-gradient(circle at 70% 60%,#fff 0 1px,transparent 1.5px);background-size:23px 29px,31px 37px}
.brand{display:flex;align-items:center;gap:8px;font-family:var(--f-display);font-weight:800;font-size:18px;margin-bottom:16px}
.brand i{width:30px;height:30px;border-radius:50%;background:var(--lime);display:grid;place-items:center;color:#10301F;font-style:normal;font-size:16px}
.who{display:flex;align-items:center;gap:10px;margin-bottom:14px}
.avatar{width:38px;height:38px;border-radius:50%;background:var(--lime);color:#10301F;display:grid;place-items:center;font-weight:700;flex:none}
.who small{display:block;color:#A9C4AE;font-size:12px}
.tabs{display:flex;flex-direction:column;gap:4px;position:relative;z-index:1}
.tab{background:transparent;border:0;color:var(--chalk);text-align:left;padding:10px 12px;border-radius:10px;display:flex;justify-content:space-between;align-items:center;gap:8px;text-decoration:none;white-space:nowrap}
.tab[aria-current="page"]{background:var(--board-2);box-shadow:inset 3px 0 0 var(--lime)}
.tab .count{font-family:var(--f-mono);font-size:12px;background:rgba(255,255,255,.12);border-radius:999px;padding:1px 8px}
.tab .count.rojo{background:var(--late);color:var(--surface)}
.main{padding:28px 32px;min-width:0;padding-bottom:120px;max-width:1040px;width:100%;justify-self:center}
.main>h3,.row h3{font-size:24px}
.row{display:flex;flex-wrap:wrap;gap:8px 14px;align-items:baseline;justify-content:space-between}
.atras{display:inline-flex;align-items:center;gap:4px;font-size:14px;font-weight:700;color:var(--muted);text-decoration:none;margin-bottom:12px}

/* Inicio: saludo, barra inteligente, chips y panel de tarjetas */
.hola h2{font-size:28px;font-weight:800}
.hola p{margin:2px 0 0;color:var(--muted)}
.cmd{position:relative;margin-top:16px;z-index:12}
.cmd-box{display:flex;align-items:center;gap:10px;background:var(--surface);border:1.5px solid var(--line);border-radius:16px;padding:4px 6px 4px 14px;box-shadow:0 6px 20px rgba(18,59,44,.08)}
.cmd-box:focus-within{border-color:var(--accent);box-shadow:0 0 0 4px var(--ok-bg)}
.cmd-box svg{color:var(--muted)}
.cmd input{flex:1;min-width:0;border:0;outline:0;background:transparent;font:inherit;font-size:17px;color:var(--ink);padding:10px 0}
.kbd{font-family:var(--f-mono);font-size:11px;color:var(--muted);border:1px solid var(--line);border-bottom-width:2px;border-radius:6px;padding:2px 6px;white-space:nowrap}
.sug{position:absolute;left:0;right:0;top:calc(100% + 6px);background:var(--surface);border:1px solid var(--line);border-radius:16px;box-shadow:0 16px 40px rgba(0,0,0,.18);padding:6px;max-height:min(60vh,420px);overflow:auto}
.sug-h{font-size:11px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);padding:8px 10px 4px}
.op{display:flex;gap:12px;align-items:center;width:100%;border:0;background:transparent;text-align:left;padding:9px 10px;border-radius:10px}
.op[aria-selected="true"],.op:hover{background:var(--ok-bg)}
.op .ic{width:34px;height:34px;border-radius:10px;background:var(--bg);display:grid;place-items:center;color:var(--accent);flex:none}
.op .tx{flex:1;min-width:0}
.op b{display:block;font-weight:700}
.op small{display:block;color:var(--muted);font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.op mark{background:none;color:var(--accent);font-weight:800}
.op .tipo{font-size:11px;color:var(--muted)}
.chips{display:flex;gap:8px;overflow-x:auto;margin:12px -22px 0;padding:0 22px 4px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{display:inline-flex;align-items:center;gap:6px;white-space:nowrap;border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:7px 12px;font-size:14px}
.chip:hover{border-color:var(--accent)}
.chip.rojo{border-color:var(--late);color:var(--late);background:var(--late-bg)}
.chip .por{font-size:11px;color:var(--muted)}

.panel{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px;margin-top:18px;align-items:start}
.panel .ancho{grid-column:1/-1}
.tarj{background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:16px;min-width:0}
.tarj-h{display:flex;align-items:center;gap:10px;margin-bottom:10px}
.tarj-h .ic{width:36px;height:36px;border-radius:10px;background:var(--ok-bg);color:var(--accent);display:grid;place-items:center;flex:none}
.tarj-h h4{font-size:18px;flex:1;min-width:0;line-height:1.15}
.tarj-h small{display:block;font-family:var(--f-body);font-weight:400;font-size:13px;color:var(--muted)}
.tarj-h .cerrar{border:0;background:transparent;width:40px;height:40px;margin:-4px -6px -4px 0;border-radius:50%;display:grid;place-items:center;color:var(--muted)}
.tarj-h .cerrar:hover{background:var(--bg)}
.tarj.accion{border-color:var(--accent);box-shadow:0 0 0 3px color-mix(in srgb,var(--accent) 28%,transparent);animation:entra .35s cubic-bezier(.2,1.2,.4,1)}
@keyframes entra{from{transform:translateY(-10px) scale(.98)}}
@media (prefers-reduced-motion:reduce){.tarj.accion{animation:none}}
.vermas{font-size:13px;font-weight:700;text-decoration:none;white-space:nowrap;padding:12px 0;margin:-12px 0}
.pill{display:inline-flex;align-items:center;gap:4px;font-size:12px;font-weight:700;border-radius:999px;padding:2px 10px;white-space:nowrap}
.pill.late{background:var(--late-bg);color:var(--late)}
.pill.soon{background:var(--warn-bg);color:var(--warn)}
.pill.ok{background:var(--ok-bg);color:var(--accent)}

/* Aviso de la diapositiva 7 */
.aviso{display:flex;gap:12px;align-items:center;background:var(--ok-bg);border-left:4px solid var(--accent);border-radius:14px;padding:12px 12px 12px 14px;margin-top:18px}
.aviso .ic{width:36px;height:36px;border-radius:50%;background:var(--accent);color:var(--surface);display:grid;place-items:center;flex:none}
.aviso p{margin:0;flex:1}
.aviso button{border:0;background:transparent;width:32px;height:32px;border-radius:50%;display:grid;place-items:center;color:var(--muted)}

/* Filas de horario y entregas (diapositiva 7) */
.fila{display:grid;grid-template-columns:64px minmax(0,1fr) auto;gap:10px;align-items:center;padding:10px 8px;border-top:1px solid var(--line);color:inherit;text-decoration:none;border-radius:10px}
.fila:first-of-type,.tarj-h + .fila{border-top:0}
.fila time{font-family:var(--f-mono);font-size:13px;line-height:1.3}
.fila b{display:block}
.fila small{display:block;color:var(--muted);font-size:13px}
.fila .aula{display:flex;align-items:center;gap:4px;font-size:14px;color:var(--muted);white-space:nowrap}
.fila.cambio{background:var(--ok-bg);box-shadow:inset 4px 0 0 var(--accent);border-top-color:transparent}
.fila.cambio .aula{color:var(--accent);font-weight:700}
.fila.cambio + .fila{border-top-color:transparent}
.fila-e{grid-template-columns:36px minmax(0,1fr) auto}
.fila-e .ic{width:32px;height:32px;border-radius:9px;background:var(--bg);display:grid;place-items:center;color:var(--accent)}
a.fila:hover{background:var(--bg)}

/* Asistencia: 1 en verde, 0 en rojo; el justificante se sube en la misma fila */
.asis{display:flex;flex-direction:column;gap:8px}
.ses{border:1px solid var(--line);border-radius:12px;background:var(--bg);padding:10px 12px;display:grid;grid-template-columns:minmax(0,1fr) auto;gap:10px;align-items:center}
.ses time{display:block;font-weight:700;font-size:14px;line-height:1.3}
.ses small{display:block;color:var(--muted);font-size:13px}
.nota-a{font-family:var(--f-display);font-weight:800;font-size:26px;width:42px;height:42px;border-radius:12px;display:grid;place-items:center;background:var(--ok-bg);color:var(--accent)}
.ses.falta{border-color:var(--late);background:var(--late-bg)}
.ses.falta .nota-a,.ses.enviado .nota-a{background:var(--late);color:var(--surface)}
.ses.enviado{border-color:var(--warn)}
.ses .just{grid-column:1/-1;display:grid;gap:8px}
.drop{display:flex;align-items:center;gap:12px;padding:10px 12px;border:1.5px dashed var(--late);border-radius:12px;background:var(--surface);cursor:pointer;position:relative}
.drop:hover,.drop:focus-within{border-color:var(--accent)}
.drop input{position:absolute;width:1px;height:1px;opacity:0;pointer-events:none}
.drop .ico{width:34px;height:34px;flex:none;border-radius:10px;background:var(--board);color:var(--lime);display:grid;place-items:center;font-weight:700}
.drop b{display:block;font-size:14px}
.drop small{color:var(--muted);font-size:13px;overflow-wrap:anywhere}
.drop.has{border-style:solid;border-color:var(--accent);background:var(--ok-bg)}
.fila-b{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.linkbtn{border:0;background:none;padding:12px 0;margin:-12px 0;color:var(--accent);text-decoration:underline;font-size:13px}
.mini-asis{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}
.mini-asis span{font-family:var(--f-display);font-weight:800;width:28px;height:28px;border-radius:8px;display:grid;place-items:center;font-size:15px;background:var(--ok-bg);color:var(--accent)}
.mini-asis span.c{background:var(--late);color:var(--surface)}

/* Reservas (pádel, aulas) */
.seg{display:flex;gap:6px;flex-wrap:wrap;margin:4px 0 10px}
.seg button{border:1.5px solid var(--line);background:var(--surface);border-radius:999px;padding:9px 14px;font-size:14px}
.seg button[aria-pressed="true"]{border-color:var(--accent);background:var(--ok-bg);color:var(--accent);font-weight:700}
.slots{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px;margin-bottom:12px}
.slot{border:1.5px solid var(--line);background:var(--surface);border-radius:12px;padding:8px 4px;text-align:center;font-family:var(--f-mono);font-size:14px}
.slot small{display:block;font-family:var(--f-body);font-size:11px;color:var(--muted)}
.slot[aria-pressed="true"]{border-color:var(--accent);background:var(--ok-bg);color:var(--accent)}
.slot:disabled{opacity:.45;cursor:not-allowed;text-decoration:line-through}
.hecho{display:flex;gap:10px;align-items:center;background:var(--ok-bg);color:var(--accent);border-radius:12px;padding:12px;font-weight:700}
.lbl{font-size:13px;font-weight:700;color:var(--muted);margin-top:6px}

/* Listas de las otras pestañas (mock-up) */
.list{display:flex;flex-direction:column;gap:8px;margin-top:14px}
.item{display:grid;grid-template-columns:110px minmax(0,1fr) auto;gap:12px;align-items:center;padding:12px 14px;border:1px solid var(--line);border-radius:12px;background:var(--surface);color:inherit;text-decoration:none}
.item time{font-family:var(--f-mono);font-size:13px}
.item .what{font-weight:700}
.item .what small{display:block;color:var(--muted);font-weight:400}
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:12px;margin-top:14px}
.card{border:1px solid var(--line);border-radius:12px;padding:14px;background:var(--surface);min-width:0;color:inherit;text-decoration:none;display:block}
.card h4{margin:0 0 4px;font-size:15px}
.card.act{display:flex;flex-direction:column;gap:4px}
.card.act .note{margin:0 0 14px}
.card.act .btn{margin-top:auto;align-self:flex-start;min-width:150px}
.code{font-family:var(--f-mono);font-size:11.5px;color:var(--muted);word-break:break-all}
.doc{border:1px solid var(--line);border-radius:12px;padding:16px;background:var(--bg);font-size:14px;margin-top:10px}
.doc h5{margin:0 0 8px;font-family:var(--f-display);font-size:17px}
.ficha{display:grid;gap:4px;margin:6px 0 14px}
.ficha h3{font-size:26px}
.sub{font-size:18px;margin:22px 0 10px}

@media (max-width:760px){
  .app{grid-template-columns:minmax(0,1fr);grid-template-rows:auto 1fr}
  .side{padding:14px 16px 8px}
  .brand{margin-bottom:10px}
  .who{margin-bottom:10px}
  .tabs{flex-direction:row;overflow-x:auto;gap:6px;margin:0 -16px;padding:0 16px 4px;scrollbar-width:none}
  .tabs::-webkit-scrollbar{display:none}
  .tab{padding:10px 12px}
  .tab[aria-current="page"]{box-shadow:inset 0 -3px 0 var(--lime)}
  .main{padding:18px 16px 130px}
  .chips{margin:12px -16px 0;padding:0 16px 4px}
  .panel{grid-template-columns:minmax(0,1fr)}
  .kbd{display:none}
  .chip .por{display:none}
  .chip{font-size:13px;padding:8px 11px}
  .fila{grid-template-columns:52px minmax(0,1fr) auto;gap:8px;padding:10px 6px}
  .fila-e{grid-template-columns:32px minmax(0,1fr) auto;align-items:start}
  .fila .aula{font-size:13px}
  .tarj-h h4{font-size:17px}
  .tarj{padding:14px}
  .fila-e .btn.sm{padding:7px 12px;font-size:13px}
  .guide{padding:8px 12px;gap:8px}
  .guide p{font-size:13px;line-height:1.35}
  .item{grid-template-columns:64px minmax(0,1fr) auto;gap:10px}
}

/* Pestañas dentro de una asignatura */
.subnav{display:flex;gap:6px;overflow-x:auto;margin:4px 0 16px;padding-bottom:4px;scrollbar-width:none;border-bottom:1px solid var(--line)}
.subnav::-webkit-scrollbar{display:none}
.subnav a{display:inline-flex;align-items:center;gap:6px;white-space:nowrap;padding:10px 12px;color:var(--muted);text-decoration:none;font-weight:700;font-size:15px;border-bottom:3px solid transparent;margin-bottom:-5px}
.subnav a[aria-current="page"]{color:var(--ink);border-bottom-color:var(--accent)}

/* Contenido por temas */
.temas{display:flex;flex-direction:column;gap:8px;margin-top:10px}
.tema{background:var(--surface);border:1px solid var(--line);border-radius:14px;overflow:hidden}
.tema summary{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:12px 14px;cursor:pointer;font-weight:700;list-style:none;min-height:48px}
.tema summary::-webkit-details-marker{display:none}
.tema summary>span:first-child{display:flex;align-items:center;gap:10px;min-width:0}
.tema summary svg{color:var(--accent)}
.tema summary::after{content:"›";color:var(--muted);font-size:20px;transition:transform .15s;margin-left:4px}
.tema[open] summary::after{transform:rotate(90deg)}
.tema[open] summary{border-bottom:1px solid var(--line)}
.tema-c{padding:6px 10px 10px;display:flex;flex-direction:column;gap:2px}
.mat{display:flex;align-items:center;gap:10px;width:100%;border:0;background:transparent;text-align:left;padding:10px 8px;border-radius:10px;font-size:15px;min-height:44px}
.mat:hover{background:var(--bg)}
.mat svg{color:var(--muted)}
.mat span:first-of-type{flex:1;min-width:0}

/* Calificaciones */
.resumen-n{display:flex;gap:18px;align-items:center;flex-wrap:wrap;margin-bottom:8px}
.resumen-n .lbl{display:block;margin:0 0 4px}
.media{font-family:var(--f-display);font-weight:800;font-size:36px;color:var(--accent);line-height:1}
.media.sm{font-size:22px}
.barra-n{height:8px;border-radius:999px;background:var(--bg);border:1px solid var(--line);overflow:hidden;margin-top:6px}
.barra-n span{display:block;height:100%;background:var(--accent);border-radius:999px}
.fila-n{grid-template-columns:minmax(0,1fr) auto auto}
.nota-n{font-family:var(--f-display);font-weight:800;font-size:20px;min-width:52px;text-align:right}
.nota-n.pend{font-family:var(--f-body);font-weight:400;font-size:13px;color:var(--muted)}
.nota-n.baja{color:var(--late)}

/* Mensajes */
.fila-chat{width:100%;border:0;background:transparent;text-align:left;cursor:pointer}
.fila-chat small{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.chat{display:flex;flex-direction:column;gap:8px;max-height:min(50vh,380px);overflow-y:auto;padding:4px 2px 10px}
.msg{max-width:85%;background:var(--bg);border:1px solid var(--line);border-radius:14px 14px 14px 4px;padding:8px 12px;align-self:flex-start}
.msg b{display:block;font-size:13px;color:var(--accent)}
.msg p{margin:2px 0}
.msg small{display:block;font-size:11px;color:var(--muted);text-align:right}
.msg.yo{align-self:flex-end;background:var(--ok-bg);border-color:transparent;border-radius:14px 14px 4px 14px}
.enviarmsg{display:flex;gap:8px;border-top:1px solid var(--line);padding-top:10px}

/* Puntúa cada acción con las palabras escritas; entiende frases como «reservar pádel viernes a las 19» */
function buscar(q){
  const limpia = s => norm(s).replace(/[·:]/g,' ').replace(/\s+/g,' ').trim();
  const nq = limpia(q); if (!nq) return [];
  const palabras = nq.split(/\s+/).filter(w => w && !VACIAS.has(w) && !/^\d/.test(w));
  return ACCIONES.map(a => {
    const nt = limpia(a.t), nk = norm(a.k + ' ' + a.t);
    let p = 0;
    if (nt.startsWith(nq)) p += 6;
    if (nt.includes(nq)) p += 3;
    const toks = nk.split(/[\s:·]+/);
    for (const w of palabras){ if (toks.some(t => t.startsWith(w))) p += 4; else if (nk.includes(w)) p += 2; }
    if (!palabras.length && /reserv/.test(nq) && a.tipo==='Reserva') p += 3;
    return {a, p};
  }).filter(x => x.p > 0).map(x => ({a:x.a, p:x.p + (palabras.length <= 1 ? (x.a.prio||0) : 0)})).sort((x,y) => y.p - x.p).slice(0,6).map(x => x.a);
}
function parametros(q){
  const n = norm(q), r = {};
  if (/\bviernes\b/.test(n)) r.dia = 'viernes'; else if (/\bmanana\b/.test(n)) r.dia = 'manana'; else if (/\bhoy\b|\besta tarde\b/.test(n)) r.dia = 'hoy';
  const h = n.match(/\b(?:a las\s*)?(\d{1,2})(?::(\d{2}))?\s*(?:h\b)?/);
  if (h && +h[1] >= 7 && +h[1] <= 22) r.hora = String(h[1]).padStart(2,'0') + ':' + (h[2]||'00');
  return r;
}
function resaltar(t, q){
  const nq = norm(q).trim().split(/\s+/).filter(w => w.length > 1 && !VACIAS.has(w))[0]; if (!nq) return t;
  const i = norm(t).indexOf(nq); if (i < 0) return t;
  return t.slice(0,i) + '<mark>' + t.slice(i, i+nq.length) + '</mark>' + t.slice(i+nq.length);
}

  return out;
}

const EN_PANEL = {horario:'t-horario', justificante:'t-asis', entregas:'t-entregas'};

    const ir = () => { const el = document.getElementById(EN_PANEL[id]); if (!el) return; el.scrollIntoView({behavior:'smooth', block:'start'}); el.classList.add('accion'); setTimeout(() => el.classList.remove('accion'), 1800); };
    if (ruta()!=='inicio'){ location.hash = '#/inicio'; setTimeout(ir, 60); } else ir();
    return;
  }
  if (q){ const p = parametros(q); if (id==='padel'){ if (p.dia) S.padel.dia = p.dia; if (p.hora && PADEL_HORAS.includes(p.hora)) S.padel.hora = p.hora; }
          if (id==='aula'){ if (p.dia) S.aula.dia = p.dia; if (p.hora && AULA_HORAS.includes(p.hora)) S.aula.hora = p.hora; } }
  if (id==='padel' && !S.padel.dia) S.padel.dia = dias().some(d => d.k==='viernes') ? 'viernes' : 'hoy';
  S.abiertas = [id, ...S.abiertas.filter(x => x!==id)];

  cerrarSug(); document.getElementById('q').value = '';
  if (ruta()!=='inicio') location.hash = '#/inicio'; else pintar();
  requestAnimationFrame(() => { const el = document.getElementById('a-'+id); if (el) el.scrollIntoView({behavior:'smooth', block:'nearest'}); });
}

  }
  return `<div class="row"><h3>Mis asignaturas</h3><span class="note">7 asignaturas · datos de Blackboard</span></div>
  <div class="cards">${SUBJECTS.map(s => `<a class="card" href="#/asig/${s.id}"><h4>${s.n}</h4><div class="code">${s.c}</div>${s.p?`<p class="note" style="margin:8px 0 0">Profesor: ${s.p}</p>`:''}${s.last?`<p class="note" style="margin:8px 0 0">${s.last}</p>`:''}${s.id==='aiii'&&!S.justificado?'<p style="margin:8px 0 0"><span class="pill late">1 falta sin justificar</span></p>':''}</a>`).join('')}</div>`;
};
V.notas = () => `<div class="row"><h3>Calificaciones</h3><span class="demo-flag">notas de ejemplo</span></div>
  <p class="note">Media de lo ya publicado, ponderada por el peso de cada parte en la guía docente.</p>
  <div class="cards">${SUBJECTS.map(s => { const m = media(s.id), nueva = (NOTAS[s.id]||[]).some(x => x.nuevo);
    return `<a class="card" href="#/asig/${s.id}/notas"><div class="row" style="align-items:center"><h4 style="flex:1">${s.n}</h4><b class="media sm">${num(m.media)}</b></div>
      <div class="barra-n"><span style="width:${m.evaluado}%"></span></div><p class="note" style="margin:6px 0 0">Evaluado ${m.evaluado} %${nueva?' · <span class="pill ok">nota nueva</span>':''}</p></a>`; }).join('')}</div>`;
V.msg = (id) => {
  const c = id && CHATS.find(x => x.id===id);
  if (c){ S.leidos[c.id] = true; guardar();
    return `<a class="atras" href="#/msg">‹ Mensajes</a><div class="row"><h3>${esc(c.t)}</h3><span class="note">${c.n} personas${c.s?` · <a href="#/asig/${c.s}">ver asignatura</a>`:''}</span></div>
      <div class="tarj" style="margin-top:12px">${chatHTML(c.id,'msg')}</div><p class="note">Chat de ejemplo: tus mensajes se quedan en este navegador.</p>`; }
  return `<div class="row"><h3>Mensajes</h3><span class="demo-flag">chats de ejemplo</span></div>
    <p class="note">Un chat por asignatura y por grupo de trabajo.</p><div class="tarj" style="margin-top:12px">${listaChats(false)}</div>`;
};
V.ent = () => `<div class="row"><h3>Entregas</h3><span class="note">Todas tus asignaturas, por fecha</span></div>
  <div class="list">${DUE.map(x => `<a class="item" href="#/asig/${x.s}"><time>${fmt.format(new Date(x.d))} · ${fmtH.format(new Date(x.d))}</time><div class="what">${x.t}<small>${subj(x.s).n}</small></div>${pill(x.d)}</a>`).join('')}</div>`;
V.tram = () => `<div class="row"><h3>Trámites</h3><span class="demo-flag">simulado: no se envía nada</span></div>
  <div class="aviso"><p>Los justificantes de faltas se suben en <b>Asistencia</b>, junto a la falta. Las reservas de aulas, desde la barra de Inicio. <a href="#/inicio">Ir a Inicio</a></p></div>
  <h3 class="sub">Matrícula firmada</h3>
  <button class="btn dark" onclick="S.mat=!S.mat;guardar();pintar()">${S.mat?'Ocultar':'Ver'} matrícula 2026/27</button>
  ${S.mat ? T.matricula().replace(/<div class="tarj-h">[\s\S]*?<\/div>/,'') : ''}`;
V.com = () => `<div class="row"><h3>Comunidad</h3><span class="demo-flag">compañeros de ejemplo</span></div>
  <p class="note">Apuntes y clases de apoyo de alumnos que ya aprobaron la asignatura.</p>
  <div class="cards">${COMUNIDAD.map(c => `<div class="card act"><h4>${c.t}</h4><p class="note">${c.s}</p><button class="btn" id="btn-${c.id}" ${S.com[c.id]?'disabled':''} onclick="comAccion('${c.id}')">${S.com[c.id]?'✓ '+c.hecho:c.accion}</button></div>`).join('')}</div>`;

/* ---------- Acciones ---------- */
function enviarJust(){ if(!S.archivo) return; S.justificado = true; guardar(); pintar(); toast('Justificante enviado. La falta queda pendiente de revisión.'); }
function reservarPadel(){ const p = S.padel; if (!p.hora) return; p.hecho = `${diaTxt(p.dia)} · ${p.hora} · Pista ${1 + PADEL_HORAS.indexOf(p.hora) % 2}`; guardar(); pintar(); toast('Pista reservada (demo)'); }
function ejemplo(){ S.archivo = 'justificante-medico.pdf'; guardar(); pintar(); }
function comAccion(id){ S.com[id] = true; guardar(); pintar(); toast(id==='apuntes' ? 'Solicitud enviada (demo)' : 'Apuntado (demo)'); }

/* ---------- Barra: sugerencias en vivo, teclado y Ctrl+K / «/» ---------- */
let opciones = [], sel = 0;
function pintarSug(){
  const q = document.getElementById('q'), box = document.getElementById('sug'); if (!q) return;
  const v = q.value;
  if (v.trim()) opciones = buscar(v).map(a => ({a, q:v}));
  else opciones = chips().map(c => ({a: ACCIONES.find(x => x.id===c.id), q:c.q, chip:c})).filter(o => o.a);
  if (!opciones.length){ box.innerHTML = `<p class="note" style="padding:10px">Nada con «${v.replace(/</g,'&lt;')}». Prueba «pádel», «aula», «justificante» o una asignatura.</p>`; }
  else box.innerHTML = `<div class="sug-h">${v.trim() ? 'Resultados' : 'Para ahora'}</div>` + opciones.map((o,i) => `<button class="op" role="option" id="op-${i}" aria-selected="${i===sel}" onmousedown="event.preventDefault()" onclick="elegir(${i})"><span class="ic">${ic(o.a.ico)}</span><span class="tx"><b>${resaltar(o.chip ? o.chip.t : o.a.t, v)}</b><small>${o.a.s}</small></span><span class="tipo">${o.a.tipo}</span></button>`).join('');
  box.hidden = false; q.setAttribute('aria-expanded','true');
}
function cerrarSug(){ const b = document.getElementById('sug'); if (b) b.hidden = true; const q = document.getElementById('q'); if (q) q.setAttribute('aria-expanded','false'); sel = 0; }
function elegir(i){ const o = opciones[i]; if (o) abrir(o.a.id, o.q); }
function enlazarBarra(){
  const q = document.getElementById('q'); if (!q) return;
  q.addEventListener('focus', () => { sel = 0; pintarSug(); });
  q.addEventListener('input', () => { sel = 0; pintarSug(); });
  q.addEventListener('blur', () => setTimeout(cerrarSug, 120));
  q.addEventListener('keydown', e => {
    if (e.key==='ArrowDown'){ sel = Math.min(sel+1, opciones.length-1); pintarSug(); e.preventDefault(); }
    else if (e.key==='ArrowUp'){ sel = Math.max(sel-1, 0); pintarSug(); e.preventDefault(); }
    else if (e.key==='Enter'){ elegir(sel); e.preventDefault(); }
    else if (e.key==='Escape'){ q.value=''; cerrarSug(); q.blur(); }
  });
}
document.addEventListener('keydown', e => {
  const enCampo = /INPUT|TEXTAREA|SELECT/.test(document.activeElement.tagName);
  if ((e.key==='k' && (e.ctrlKey||e.metaKey)) || (e.key==='/' && !enCampo)){
    e.preventDefault();
    if (ruta()!=='inicio'){ location.hash = '#/inicio'; setTimeout(() => document.getElementById('q')?.focus(), 50); }
    else document.getElementById('q')?.focus();
  }
});

/* ---------- Guía del Happy Path ---------- */
function paso(){
  const r = ruta();
  if (!S.justificado){
    if (r!=='inicio' && !r.startsWith('asig/aiii')) return {n:1, ir:'#/inicio'};
    if (!S.archivo) return {n:1, t:'Inicio: el aula nueva ya está en el horario. Y un 0 en rojo: sube el justificante ahí mismo.', obj:'.fila-falta'};
    return {n:1, t:'Justificante listo. Envíalo.', obj:'.enviar'};
  }
  if (!S.padel.hecho){
    if (r!=='inicio') return {n:2, ir:'#/inicio'};
    if (!S.abiertas.includes('padel')) return {n:2, t:'Escribe «pa» en la barra (o toca el chip) y elige Pádel.', obj:'.cmd-box'};
    return {n:2, t: S.padel.hora ? 'Reserva la pista.' : 'La tarjeta sale en el mismo Inicio. Elige una hora.', obj: S.padel.hora ? '#reservar-padel' : '#a-padel .slots'};
  }
  if (!S.com.apuntes){
    if (r!=='inicio' && r!=='com') return {n:3, ir:'#/inicio'};
    return {n:3, t:'Comunidad, también aquí: pide los apuntes de Análisis III.', obj:'#btn-apuntes'};
  }
  return {n:4, t:'Fin: horario con cambios, entregas, asistencia con justificante, una reserva y la comunidad, sin salir de Inicio.'};
}
function guiaHTML(){
  if (!S.guia) return `<button class="btn guide-on" onclick="S.guia=true;guardar();pintar()">Guía de la demo</button>`;
  const p = paso();
  const txt = p.n===4 ? `${p.t} <a href="#" onclick="reiniciar();return false">Reiniciar</a>` : p.t || `Fuera del recorrido. <a href="${p.ir}">Volver al paso ${p.n}</a>`;
  return `<div class="guide" role="status"><b>${p.n===4?'Demo ✓':'Paso '+p.n+'/3'}</b><p>${txt}</p><button onclick="S.guia=false;guardar();pintar()">Ocultar</button></div>`;
}

/* ---------- Pintar ---------- */
let toastT;
function toast(m){ const t = document.getElementById('toast'); t.textContent = m; t.hidden = false; clearTimeout(toastT); toastT = setTimeout(() => t.hidden = true, 2600); }
function pintar(){
  const [r, arg, sub] = ruta().split('/');
  const act = V[r] ? r : 'inicio';
  const vivas = DUE.filter(x => new Date(x.d) > new Date()).length;
  document.getElementById('tabs').innerHTML = [
    ['inicio','Inicio',''],
    ['asig','Asignaturas', S.justificado ? `<span class="count">${SUBJECTS.length}</span>` : '<span class="count rojo" title="Faltas sin justificar">1</span>'],
    ['notas','Calificaciones',''],
    ['ent','Entregas', `<span class="count">${vivas}</span>`],
    ['msg','Mensajes', sinLeer() ? `<span class="count rojo" title="Sin leer">${sinLeer()}</span>` : ''],
    ['tram','Trámites',''], ['com','Comunidad','']
  ].map(([k,t,c]) => `<a class="tab" id="tab-${k}" href="#/${k}" ${act===k?'aria-current="page"':''}>${t} ${c}</a>`).join('');
  const vista = V[act](arg, sub);   // la vista primero: abrir un chat lo marca como leído
  document.getElementById('tabs').querySelectorAll('#tab-msg .count').forEach(e => { if (!sinLeer()) e.remove(); else e.textContent = sinLeer(); });
  document.getElementById('view').innerHTML = vista + `<p class="note pie">Prototipo del MVP · asignaturas y entregas reales de Blackboard (26/10/2026); horario, aulas, asistencia, contenido, notas, chats, compañeros y reservas de ejemplo · no se conecta a ningún portal · <a href="#" onclick="reiniciar();return false">Reiniciar demo</a></p>`;
  document.getElementById('guia').innerHTML = guiaHTML();
  if (S.guia){ const p = paso(); if (p.obj){ const el = document.querySelector(p.obj); if (el) el.classList.add('spot'); } }
  document.querySelectorAll('.j-file').forEach(jf => jf.addEventListener('change', () => { const f = jf.files[0]; if (f){ S.archivo = f.name; guardar(); pintar(); } }));
  enlazarBarra();
}
const render = pintar;
window.addEventListener('hashchange', () => { pintar(); window.scrollTo(0,0); });
pintar();
</script>
