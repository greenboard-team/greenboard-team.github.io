     Asignaturas con pestañas (Contenido por temas y guía docente · Notas · Asistencia · Entregas · Chat),
     Calificaciones (media ponderada) y Mensajes (chats de clase y de grupo, issue #43).
     Happy Path: greenboard/mvp/happy-path.md.
     Datos reales (#42, datos reales): tras entrar con un correo de alumno de U-tad, el horario de tus grupos de
     WebUntis con sus cambios, las aulas libres y tus entregas de Blackboard salen del Worker greenboard-mvp
     (/app/*, _api/greenboard-mvp/src/cuentas.js). Sin sesión no se ve nada real. Con #demo, los datos de ejemplo. -->
