# API de la lista de prueba del MVP (diapositiva 9 del Sprint 2).
# Cuenta de Cloudflare de Dmitrii. Desplegar: npx wrangler deploy (desde esta carpeta).
# Secreto, una sola vez: npx wrangler secret put ADMIN_TOKEN   (reinicia la lista y lee los correos)
name = "greenboard-mvp"
main = "src/index.js"
compatibility_date = "2026-09-01"

[[durable_objects.bindings]]
name = "LISTA"
class_name = "Lista"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["Lista"]

[vars]
# Cuándo se abre la lista para apuntarse (antes, la API responde "cerrado"). ISO 8601 con zona: 15:00 de Madrid.
APERTURA = "2026-11-10T15:00:00+01:00"
# Nombre del objeto que guarda la lista y la foto. Cambiarlo = empezar de cero con código nuevo.
OBJETO = "sprint2-presentacion"

[observability]
enabled = true
